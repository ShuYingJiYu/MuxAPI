<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MuxAPI 管理后台</title>
  </head>
  <body>
    <div id="app">
      <div class="boot-screen" aria-label="MuxAPI 正在启动">
        <span class="boot-mark"></span>
        <strong>MuxAPI</strong>
        <span>正在启动</span>
      </div>
    </div>
    <style>
      .boot-screen { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 10px; background: #fffbea; color: #7d6e80; font: 14px system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
      .boot-screen strong { color: #463c4a; font-size: 19px; }
      .boot-mark { width: 30px; height: 30px; border: 3px solid rgba(211, 155, 53, .22); border-top-color: #d39b35; border-radius: 50%; animation: boot-spin 1s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-mark { animation: none; } }
    </style>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
