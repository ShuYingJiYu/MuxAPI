<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fffaf2" />
    <title>MuxAPI 管理后台</title>
    <script>
      (() => {
        const ids = ['peach-soda', 'sakura-milk', 'mint-salt', 'starlight-candy']
        try {
          const stored = localStorage.getItem('muxapi_theme')
          const theme = ids.includes(stored) ? stored : ids[0]
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme === 'starlight-candy' ? 'dark' : 'light'
        } catch {
          document.documentElement.dataset.theme = ids[0]
        }
      })()
    </script>
  </head>
  <body>
    <div id="app">
      <div class="boot-screen" role="status" aria-live="polite" aria-label="MuxAPI 正在启动">
        <span class="boot-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M13 2 4.1 12.7h7.1L11 22l8.9-10.7h-7.1L13 2Z" /></svg>
        </span>
        <strong>MuxAPI</strong>
        <span class="boot-status">正在准备控制台</span>
        <span class="boot-progress" aria-hidden="true"><i></i></span>
      </div>
    </div>
    <style>
      :root {
        --boot-canvas: #fffaf2; --boot-muted: #938995; --boot-line: #f1eade;
        --boot-a: #f58daf; --boot-b: #85c8e5; --boot-c: #45c9b6;
      }
      :root[data-theme="sakura-milk"] {
        --boot-canvas: #fff7fb; --boot-muted: #9b8497; --boot-line: #f4e7ef;
        --boot-a: #f47fa9; --boot-b: #9b9be8; --boot-c: #75c8e8;
      }
      :root[data-theme="mint-salt"] {
        --boot-canvas: #f3fffb; --boot-muted: #7f9693; --boot-line: #e0efec;
        --boot-a: #36cbb1; --boot-b: #68bfe5; --boot-c: #ff8eaa;
      }
      :root[data-theme="starlight-candy"] {
        --boot-canvas: #1a171f; --boot-muted: #9f96a6; --boot-line: #35303c;
        --boot-a: #ff87b7; --boot-b: #8bbcf5; --boot-c: #6edfd0;
      }
      html, body, #app { width: 100%; height: 100%; margin: 0; }
      body { background: var(--canvas, var(--boot-canvas)); }
      .boot-screen {
        min-height: 100%; display: grid; place-content: center; justify-items: center;
        grid-template-columns: minmax(0, 220px); gap: 8px; padding: 24px; box-sizing: border-box;
        background: var(--canvas, var(--boot-canvas)); color: var(--boot-muted);
        font: 13px/1.5 "Noto Sans SC", "Microsoft YaHei UI", "Segoe UI", sans-serif;
      }
      .boot-mark {
        position: relative; width: 48px; height: 48px; display: grid; place-items: center;
        margin-bottom: 5px; border-radius: 50%; color: #fff;
        background: linear-gradient(135deg, var(--boot-a), var(--boot-b));
        box-shadow: 0 7px 20px rgba(151, 126, 151, .20);
        animation: boot-mark-in .35s ease-out both;
      }
      .boot-mark::after {
        content: ''; position: absolute; inset: -6px; border: 1px solid rgba(108, 216, 201, .34);
        border-radius: 50%; animation: boot-ring 1.7s ease-in-out infinite;
      }
      .boot-mark svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
      .boot-screen strong {
        color: var(--boot-a); font: 650 20px/1.25 "Bahnschrift", "Noto Sans SC", "Microsoft YaHei UI", sans-serif;
        background: linear-gradient(120deg, var(--boot-a), var(--boot-b)); background-clip: text;
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      }
      .boot-status { color: var(--boot-muted); font-size: 12px; }
      .boot-progress { width: 136px; height: 3px; overflow: hidden; margin-top: 8px; border-radius: 3px; background: var(--boot-line); }
      .boot-progress i {
        display: block; width: 38%; height: 100%; border-radius: inherit;
        background: linear-gradient(90deg, var(--boot-a), var(--boot-b), var(--boot-c));
        animation: boot-progress 1.35s ease-in-out infinite;
      }
      @keyframes boot-mark-in { from { opacity: 0; transform: translateY(4px) scale(.94); } to { opacity: 1; transform: none; } }
      @keyframes boot-ring { 0%, 100% { opacity: .35; transform: scale(.94); } 50% { opacity: .9; transform: scale(1.04); } }
      @keyframes boot-progress { from { transform: translateX(-105%); } to { transform: translateX(270%); } }
      @media (prefers-reduced-motion: reduce) {
        .boot-mark, .boot-mark::after, .boot-progress i { animation: none; }
        .boot-progress i { width: 100%; }
      }
    </style>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
